apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-app-config
  namespace: {{ .Release.Namespace }}
data:
  QDRANT_URL: {{ .Values.qdrant.url | quote }}
  QDRANT_COLLECTION: {{ .Values.qdrant.collection | quote }}
  DOCS_PATH: "/docs"
  EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
  CHAT_MODEL: {{ .Values.chatModel | quote }}
  CLUSTER_CHAT_MODEL: {{ .Values.clusterChatModel | quote }}
  MINIMAX_BASE_URL: {{ .Values.minimaxBaseUrl | quote }}
  CHUNK_SIZE: {{ .Values.chunkSize | quote }}
  CHUNK_OVERLAP: {{ .Values.chunkOverlap | quote }}
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "300"
