# Path on the Kubernetes node's filesystem where your source docs live.
# This is the one value most users need to change.
docsHostPath: /home/fwalanga/workstation/sy

image:
  repository: syfalanga/rag-knowledge-base
  tag: latest
  pullPolicy: IfNotPresent

# Set via --set minimaxApiKey=... at install time — do not commit real keys here.
minimaxApiKey: ""
minimaxBaseUrl: https://api.minimax.io/v1

qdrant:
  url: http://qdrant:6333
  collection: k3s-docs

chatModel: MiniMax-M3
clusterChatModel: MiniMax-M3
chunkSize: 500
chunkOverlap: 50

service:
  nodePort: 30080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
